name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test Plugins in Enigma2
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/openatv/enigma2-testenv/enigma2-testenv:latest
      options: --user root

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Plugin
        run: |
          set -e

          cd /tmp

          for repo in 3GModemManager ABMCustomMixImporter AboutBoxBranding AnimationSetup AudioEffect autoBLchanger Blindscan BTDevicesManager ChannelsImporter Chefkoch CleverTanken DLNABrowser DLNAServer EPGTranslator Fempa HbbTV LCD4linux LottoExtended PiconManager PiconsUpdater RemoteChannelStreamConverter SatipClient SimpleFancontrol StreamTV TempFanControl tmdb TunerServer TVSpielfilm VentonFancontrol WebkitHbbTV WirelessAccessPoint witaispeechtotext xmlUpdate ardmediathek bitrateviewer AutoTimer BirthdayReminder BMediaCenter EPGRefresh EPGSearch FritzCall IMDb Netzkino Schiffe SHOUTcast SimpleRSS SRFMediathek Sudoku Tetris vierg WeatherPlugin ZDFMediathek AudioSync AutomaticCleanup AutomaticTimerlistCleanup AutoResolution BabelZapper CDInfo EPGBackup EPGExport eSame MPHelp Toolkit AspectRatioSwitch Partnerbox AudioRestart MovieCut fstabEditor FTPBrowser InfoBarTunerState KiddyTimer LetterBox LogoManager MediaDownloader SPDyn MovieTagger MultiRC NameZap PermanentClock ReconstructApSc remoteTimer DVDBackup FanControl2 Series2Folder SeriesPlugin ShowClock WeatherComponentHandler WerbeZapper ZapHistoryBrowser ZapStatistic WebInterface WebAdmin WebBouquetEditor UShare; do
            echo "Cloning $repo..."
            git clone --depth 1 https://github.com/oe-alliance-plugins/$repo.git
            cd $repo/src
            python3 setup.py install \
              --prefix=/usr \
              --install-lib=/usr/lib/enigma2/python/Plugins \
              --install-data=/usr/share/enigma2
            cd ../..
          done

      - name: Start Xvfb
        run: |
          echo "DISPLAY=:0" >> "$GITHUB_ENV"
          Xvfb :0 -ac -screen 0 1280x720x24 &
          sleep 2

      - name: Start Enigma2
        run: |
          mkdir -p /dev/input
          export ENIGMA_DEBUG_LVL=5

          echo "Starting Enigma2..."
          enigma2 > enigma2.log 2>&1 &
          echo $! > enigma2.pid

          sleep 30

      - name: Send MENU Keypress
        run: |
          xdotool key Menu
          sleep 2

      - name: Take Screenshot
        run: |
          apt-get update -qq
          apt-get install -y -qq imagemagick
          import -window root screenshot.png

      - name: Stop Enigma2
        if: always()
        run: |
          kill "$(cat enigma2.pid)" 2>/dev/null || true
          sleep 2

          echo "==== ENIGMA2 LOG ===="
          cat enigma2.log

      - name: Check for Errors
        run: |
          echo "Searching for errors..."

          if grep -iE "error|exception|traceback|segmentation fault" enigma2.log; then
            echo "❌ Errors found in the log"
            exit 1
          fi

          echo "✅ No critical errors found"

      - name: Check for Crashlogs
        run: |
          if [ -f /tmp/enigma2_crash.log ]; then
            echo "❌ Crashlog found!"
            cat /tmp/enigma2_crash.log
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enigma2-screenshot
          path: |
            screenshot.png
            enigma2.log