name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test Plugins in Enigma2
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/openatv/enigma2-testenv/enigma2-testenv:latest
      options: --user root

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Plugin
        run: |
          set -e

          cd /tmp

          for repo in 3GModemManager ABMCustomMixImporter AboutBoxBranding AnimationSetup AudioEffect autoBLchanger Blindscan BTDevicesManager ChannelsImporter Chefkoch CleverTanken DLNABrowser DLNAServer EPGTranslator EWVFDControl F3LEDControl Fempa FirmwareUpgrade FPGAUpgrade GigaBlueBluetoothSetup GigaBlueChromium GigaBlueRemote GigaBlueVFDControl HbbTV INIVFDControl LCD4linux LottoExtended MICOMUpgrade MultiTransCodingSetup OdinM7VFDControl OnDemand PiconManager PiconsUpdater RemoteChannelStreamConverter SatipClient SF8VFDControl SimpleFancontrol StreamTV TempFanControl tmdb TransCodingSetup TunerServer TVSpielfilm VentonFancontrol VPLEDControl VuBluetoothSetup VuChromium VuDuoFanControl VuRemote WebkitHbbTV WirelessAccessPoint witaispeechtotext xmlUpdate XtrendFancontrol XtrendRemote ardmediathek bitrateviewer AutoTimer BirthdayReminder BMediaCenter EPGRefresh EPGSearch FritzCall IMDb Netzkino Schiffe SHOUTcast SimpleRSS SRFMediathek Sudoku Tetris vierg WeatherPlugin ZDFMediathek; do
            echo "Cloning $repo..."
            git clone --depth 1 https://github.com/oe-alliance-plugins/$repo.git
            cd $repo/src
            python3 setup.py install \
              --prefix=/usr \
              --install-lib=/usr/lib/enigma2/python/Plugins \
              --install-data=/usr/share/enigma2
            cd ../..
          done

      - name: Start Enigma2
        run: |
          export DISPLAY=:0
          export ENIGMA_DEBUG_LVL=5

          echo "Starting Enigma2..."
          timeout 60s enigma2 > enigma2.log 2>&1 || true

          echo "==== ENIGMA2 LOG ===="
          cat enigma2.log

      - name: Check for Errors
        run: |
          echo "Searching for errors..."

          if grep -iE "error|exception|traceback|segmentation fault" enigma2.log; then
            echo "❌ Errors found in the log"
            exit 1
          fi

          echo "✅ No critical errors found"

      - name: Check for Crashlogs
        run: |
          if [ -f /tmp/enigma2_crash.log ]; then
            echo "❌ Crashlog found!"
            cat /tmp/enigma2_crash.log
            exit 1
          fi